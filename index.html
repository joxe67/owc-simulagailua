<!DOCTYPE html>
<html lang="eu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#38bdf8',
                            500: '#0284c7',
                            600: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        input[type=range] {
            -webkit-appearance: none;
            background: #334155;
            border-radius: 6px;
            height: 6px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body class="p-2 sm:p-4 flex flex-col items-center justify-center min-h-screen">

    <main class="w-full max-w-lg bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-2xl backdrop-blur-md">
        
        <!-- Header -->
        <header class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-cyan-500/20 border border-cyan-500/30 flex items-center justify-center text-cyan-400">
                    <i class="fa-solid fa-water text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm text-white leading-none">Mutrikuko OWC Simulagailua</h1>
                    <p class="text-[10px] text-slate-400 mt-0.5">Olatu-energiaren bihurgailua</p>
                </div>
            </div>

            <!-- Play/Pause Button -->
            <button id="btnPlayPause" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
                <i class="fa-solid fa-pause" id="playIcon"></i>
                <span id="playText">Gelditu</span>
            </button>
        </header>

        <!-- Canvas Container -->
        <div class="relative w-full h-[220px] rounded-xl overflow-hidden bg-slate-950 border border-slate-800/80">
            <canvas id="owcCanvas"></canvas>
            
            <!-- Flow Status Overlay Pill -->
            <div id="flowBadge" class="absolute top-2.5 left-2.5 bg-slate-900/80 border border-slate-700/60 rounded-full px-2.5 py-1 text-[10px] text-slate-300 font-medium flex items-center gap-1.5 backdrop-blur-sm">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                <span id="flowBadgeText">Airearen Fluxua: Bare</span>
            </div>
        </div>

        <!-- Real-time Readings -->
        <div class="grid grid-cols-3 gap-2 my-3">
            <div class="bg-slate-950/70 border border-slate-800/80 rounded-lg p-2 text-center">
                <span class="block text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Potentzia</span>
                <span class="text-base font-extrabold font-mono text-cyan-400" id="valPower">0.0 <span class="text-[10px] font-normal text-slate-400">kW</span></span>
            </div>
            <div class="bg-slate-950/70 border border-slate-800/80 rounded-lg p-2 text-center">
                <span class="block text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Turbina</span>
                <span class="text-base font-extrabold font-mono text-amber-400" id="valRpm">0 <span class="text-[10px] font-normal text-slate-400">RPM</span></span>
            </div>
            <div class="bg-slate-950/70 border border-slate-800/80 rounded-lg p-2 text-center">
                <span class="block text-[10px] text-slate-400 font-semibold uppercase tracking-wider">Aire Abiadura</span>
                <span class="text-base font-extrabold font-mono text-emerald-400" id="valAirVel">0.0 <span class="text-[10px] font-normal text-slate-400">m/s</span></span>
            </div>
        </div>

        <!-- Only 2 Sliders -->
        <div class="bg-slate-950/50 border border-slate-800/60 rounded-xl p-3 space-y-3">
            <!-- 1. Wave Height Control -->
            <div>
                <div class="flex justify-between items-center text-xs mb-1">
                    <label for="sliderWaveHeight" class="text-slate-300 font-medium text-[11px] flex items-center gap-1">
                        <i class="fa-solid fa-arrows-up-down text-cyan-400"></i> Olatuen Altuera
                    </label>
                    <span class="font-mono text-cyan-400 font-bold text-xs" id="valWaveHeight">2.0 m</span>
                </div>
                <input type="range" id="sliderWaveHeight" min="0.5" max="4.5" step="0.1" value="2.0" class="w-full cursor-pointer">
                <div class="flex justify-between text-[9px] text-slate-500 mt-0.5">
                    <span>0.5m (Txikia)</span>
                    <span>4.5m (Handia)</span>
                </div>
            </div>

            <!-- 2. Wave Frequency Control -->
            <div>
                <div class="flex justify-between items-center text-xs mb-1">
                    <label for="sliderWaveFreq" class="text-slate-300 font-medium text-[11px] flex items-center gap-1">
                        <i class="fa-solid fa-wave-square text-cyan-400"></i> Olatuen Maiztasuna
                    </label>
                    <span class="font-mono text-cyan-400 font-bold text-xs" id="valWaveFreq">0.125 Hz (8.0s)</span>
                </div>
                <input type="range" id="sliderWaveFreq" min="0.10" max="0.33" step="0.01" value="0.125" class="w-full cursor-pointer">
                <div class="flex justify-between text-[9px] text-slate-500 mt-0.5">
                    <span>0.10 Hz (Periodo luzea: 10s)</span>
                    <span>0.33 Hz (Periodo laburra: 3s)</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        let isRunning = true;
        let time = 0;
        const dt = 0.03;

        // Variables
        let waveHeight = 2.0; // 0.5m - 4.5m
        let waveFreq = 0.125;  // 0.10Hz - 0.33Hz (10s down to 3s)

        let waterVelInside = 0;
        let airVel = 0;
        let turbineRpm = 0;
        let powerKw = 0;

        // Air Particles
        const particles = [];
        const numParticles = 24;
        for (let i = 0; i < numParticles; i++) {
            particles.push({
                relX: Math.random(),
                relY: Math.random()
            });
        }

        // DOM Elements
        const btnPlayPause = document.getElementById('btnPlayPause');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');

        const sliderWaveHeight = document.getElementById('sliderWaveHeight');
        const sliderWaveFreq = document.getElementById('sliderWaveFreq');
        const valWaveHeight = document.getElementById('valWaveHeight');
        const valWaveFreq = document.getElementById('valWaveFreq');

        const valPower = document.getElementById('valPower');
        const valRpm = document.getElementById('valRpm');
        const valAirVel = document.getElementById('valAirVel');
        const flowBadgeText = document.getElementById('flowBadgeText');

        const canvas = document.getElementById('owcCanvas');
        const ctx = canvas.getContext('2d');

        sliderWaveHeight.addEventListener('input', (e) => {
            waveHeight = parseFloat(e.target.value);
            valWaveHeight.textContent = waveHeight.toFixed(1) + ' m';
        });

        sliderWaveFreq.addEventListener('input', (e) => {
            waveFreq = parseFloat(e.target.value);
            const period = (1 / waveFreq).toFixed(1);
            valWaveFreq.textContent = waveFreq.toFixed(2) + ' Hz (' + period + 's)';
        });

        btnPlayPause.addEventListener('click', () => {
            isRunning = !isRunning;
            if (isRunning) {
                playIcon.className = 'fa-solid fa-pause';
                playText.textContent = 'Gelditu';
            } else {
                playIcon.className = 'fa-solid fa-play';
                playText.textContent = 'Hasi';
            }
        });

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            if (canvas.width !== rect.width || canvas.height !== rect.height) {
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
        }

        function updatePhysics() {
            if (!isRunning) return;

            time += dt;
            const omega = 2 * Math.PI * waveFreq;

            // Water velocity inside is the time derivative of chamber surface elevation
            // Elevation: y = (waveHeight/2) * Math.sin(omega * time)
            // Derivative (velocity): dy/dt = (waveHeight/2) * omega * Math.cos(omega * time)
            waterVelInside = (waveHeight / 2) * omega * Math.cos(omega * time);

            // Air velocity in narrowed duct (pneumatic multiplication effect)
            airVel = waterVelInside * 6.8;

            // Turbine Speed (RPM inertia)
            const targetRpm = Math.abs(airVel) * 65;
            turbineRpm += (targetRpm - turbineRpm) * 0.08;

            // Power Output Calculation (kW)
            const absVel = Math.abs(airVel);
            powerKw = absVel > 0.8 ? 0.0075 * Math.pow(absVel, 2.7) : 0;

            // UI Label updates
            valPower.childNodes[0].textContent = powerKw.toFixed(1) + ' ';
            valRpm.childNodes[0].textContent = Math.round(turbineRpm) + ' ';
            valAirVel.childNodes[0].textContent = absVel.toFixed(1) + ' ';

            if (Math.abs(airVel) < 0.4) {
                flowBadgeText.textContent = "Airearen Fluxua: Bare";
            } else if (airVel > 0) {
                flowBadgeText.textContent = "Airearen Fluxua: ⬆ Gorantz (Presioa)";
            } else {
                flowBadgeText.textContent = "Airearen Fluxua: ⬇ Beherantz (Xurgapena)";
            }
        }

        function draw() {
            resizeCanvas();
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            // Structural Geometry
            const chamberLeftX = w * 0.52;
            const chamberW = w * 0.32;
            const chamberRightX = chamberLeftX + chamberW;
            const ductW = w * 0.12;
            const ductX = chamberLeftX + (chamberW - ductW) / 2;
            
            const seaBaseY = h * 0.62;
            const k = 0.025; // Spatial wave number (wave length factor)
            const omega = 2 * Math.PI * waveFreq;

            // 1. Background Sky
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, w, h);

            // Calculate exact sea height at the chamber entrance (chamberLeftX)
            // Sea Wave Formula traveling LEFT to RIGHT:
            // y(x, t) = seaBaseY - (waveHeight * 12) * Math.sin(omega * time - k * x)
            const getWaveYAt = (x) => {
                return seaBaseY - (waveHeight * 12) * Math.sin(omega * time - k * x);
            };

            const chamberEntranceY = getWaveYAt(chamberLeftX);

            // 2. Continuous Water Body (Open Sea + Inside Chamber)
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.moveTo(0, h);

            // Open Sea Wave Line from Left x=0 to x=chamberLeftX
            for (let x = 0; x <= chamberLeftX; x += 3) {
                ctx.lineTo(x, getWaveYAt(x));
            }

            // Inside Chamber Water Level - SEAMLESS CONTINUITY
            // The water surface level inside the chamber seamlessly continues from the entrance level!
            ctx.lineTo(chamberRightX, chamberEntranceY);

            // Bottom Right Seal
            ctx.lineTo(chamberRightX, h);
            ctx.closePath();
            ctx.fill();

            // Water Surface Highlight Line
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let x = 0; x <= chamberLeftX; x += 3) {
                ctx.lineTo(x, getWaveYAt(x));
            }
            ctx.lineTo(chamberRightX, chamberEntranceY);
            ctx.stroke();

            // 3. Dike / OWC Structure (Rendered OVER the water)
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;

            // Submerged Wall Lip (Left side of chamber entry)
            ctx.beginPath();
            ctx.moveTo(chamberLeftX - 18, 0);
            ctx.lineTo(chamberLeftX, 0);
            ctx.lineTo(chamberLeftX, seaBaseY + 35); // Submerged lip extends below sea line
            ctx.lineTo(chamberLeftX - 18, seaBaseY + 35);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Main Concrete Wall & Roof Structure
            ctx.beginPath();
            ctx.moveTo(chamberLeftX, seaBaseY - 80);
            ctx.lineTo(chamberRightX + 25, seaBaseY - 80);
            ctx.lineTo(chamberRightX + 25, h);
            ctx.lineTo(chamberRightX, h);
            ctx.lineTo(chamberRightX, seaBaseY - 60);

            // Duct opening cutout
            ctx.lineTo(ductX + ductW, seaBaseY - 60);
            ctx.lineTo(ductX + ductW, seaBaseY - 100);
            ctx.lineTo(ductX, seaBaseY - 100);
            ctx.lineTo(ductX, seaBaseY - 60);

            ctx.lineTo(chamberLeftX, seaBaseY - 60);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 4. Air Stream Particles in the Duct
            ctx.fillStyle = airVel > 0 ? '#f59e0b' : '#38bdf8';
            particles.forEach((p) => {
                if (isRunning) {
                    p.relY -= (airVel * 0.022);
                    if (p.relY < 0) p.relY = 1;
                    if (p.relY > 1) p.relY = 0;
                }

                const px = ductX + 5 + (p.relX * (ductW - 10));
                const py = (seaBaseY - 100) + (p.relY * 40);

                ctx.beginPath();
                ctx.arc(px, py, 2, 0, Math.PI * 2);
                ctx.fill();
            });

            // 5. Wells Turbine Rendering
            const turbineY = seaBaseY - 80;
            const turbineCenterX = ductX + ductW / 2;

            // Duct highlight outline
            ctx.strokeStyle = airVel > 0 ? '#f59e0b' : '#0284c7';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(ductX, seaBaseY - 100, ductW, 40);

            // Central Rotor Hub
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(turbineCenterX, turbineY, 6, 0, Math.PI * 2);
            ctx.fill();

            // Blades (Spin continuously in ONE fixed clockwise direction)
            const angle = time * (turbineRpm / 25) * Math.PI;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            for (let b = 0; b < 4; b++) {
                const bladeAngle = angle + (b * Math.PI / 2);
                const bx = turbineCenterX + Math.cos(bladeAngle) * (ductW / 2 - 2);
                const by = turbineY + Math.sin(bladeAngle) * 4;
                ctx.beginPath();
                ctx.moveTo(turbineCenterX, turbineY);
                ctx.lineTo(bx, by);
                ctx.stroke();
            }

            // Generator Housing Box
            ctx.fillStyle = '#334155';
            ctx.fillRect(turbineCenterX - 11, seaBaseY - 118, 22, 18);
            ctx.strokeStyle = '#38bdf8';
            ctx.strokeRect(turbineCenterX - 11, seaBaseY - 118, 22, 18);

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 8px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('GEN', turbineCenterX, seaBaseY - 106);
        }

        function animate() {
            updatePhysics();
            draw();
            requestAnimationFrame(animate);
        }

        window.onload = function () {
            animate();
        };
    </script>
</body>
</html>
